<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gemini Default Model Selector</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <main class="popup-shell">
    <header class="header">
      <img class="brand-mark" src="assets/icons/icon-48.png" alt="" aria-hidden="true">
      <div>
        <h1>Gemini Default <br>Model Selector</h1>
      </div>
    </header>
    <section id="review-prompt" class="review-prompt" hidden>
      <button class="review-stars" type="button" data-review-action="rate"
        aria-label="Rate the extension in the Chrome Web Store">⭐⭐⭐⭐⭐</button>
      <p>Like this extension? A quick review helps others discover it.</p>
      <div class="review-actions">
        <button class="review-rate" type="button" data-review-action="rate">Rate</button>
        <button type="button" data-review-action="dismiss">Already rated</button>
        <button type="button" data-review-action="later">Remind me later</button>
      </div>
      <button class="review-close" type="button" data-review-action="dismiss"
        aria-label="Dismiss review reminder">×</button>
      <p id="review-status" class="review-status" role="status"></p>
    </section>
    <section id="site-access-warning" class="site-access-warning" hidden aria-label="Gemini site access warning">
      <p> Automatic selection is off. Allow permanent access to gemini.google.com in Chrome. </p>
      <button id="site-access-settings" class="site-access-settings" type="button"> Open site access settings 👈
      </button>
    </section>
    <section id="settings-panel">
      <fieldset class="model-list">
        <legend id="model-list-title" tabindex="-1">Choose the model</legend>
        <div id="model-options"></div>
      </fieldset>
      <fieldset id="thinking-section" class="thinking-section">
        <legend>Thinking level<span id="thinking-saved" hidden> (saved)</span></legend>
        <div class="thinking-grid">
          <label class="thinking-pill">
            <input type="radio" name="thinkingLevel" value="low">
            <span class="pill-label">Low</span>
          </label>
          <label class="thinking-pill">
            <input type="radio" name="thinkingLevel" value="medium">
            <span class="pill-label">Medium</span>
          </label>
          <label class="thinking-pill">
            <input type="radio" name="thinkingLevel" value="high">
            <span class="pill-label">High</span>
          </label>
        </div>
      </fieldset>
    </section>
    <p id="status" class="status" role="status" aria-live="polite"> Loading settings… </p>
    <section class="gemini-shortcut" aria-label="Open Gemini shortcut">
      <button id="open-gemini" class="open-gemini" type="button">
        <span>Open Gemini</span>
        <span id="open-gemini-shortcut">(…)</span>
      </button>
      <button id="open-gemini-shortcut-change" class="shortcut-change" type="button"
        aria-label="Change Open Gemini keyboard shortcut">Change</button>
    </section>
  </main>
  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>

</html>
