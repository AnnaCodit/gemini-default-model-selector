<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gemini Default Model Selector</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <main class="popup-shell">
    <header class="header">
      <img class="brand-mark" src="assets/icons/icon-48.png" alt="" aria-hidden="true">
      <div>
        <h1>Gemini Default <br>Model Selector</h1>
      </div>
    </header>
    <section id="settings-panel">
      <fieldset class="model-list">
        <legend>Choose the model</legend>
        <label class="model-option">
          <input type="radio" name="model" value="flash-lite-3.5">
          <span class="radio-indicator" aria-hidden="true"></span>
          <span class="model-copy">
            <strong>3.5 Flash-Lite</strong>
          </span>
        </label>
        <label class="model-option">
          <input type="radio" name="model" value="flash-3.7">
          <span class="radio-indicator" aria-hidden="true"></span>
          <span class="model-copy">
            <strong>3.7 Flash</strong>
          </span>
        </label>
        <label class="model-option">
          <input type="radio" name="model" value="pro-3.1">
          <span class="radio-indicator" aria-hidden="true"></span>
          <span class="model-copy">
            <strong>3.1 Pro</strong>
          </span>
        </label>
      </fieldset>
      <label class="thinking-option">
        <strong>Extended thinking</strong>
        <span class="switch">
          <input id="extended-thinking" type="checkbox">
          <span class="switch-track" aria-hidden="true"></span>
        </span>
      </label>
    </section>
    <p id="status" class="status" role="status" aria-live="polite"> Loading settings… </p>
    <section class="gemini-shortcut" aria-label="Open Gemini shortcut">
      <button id="open-gemini" class="open-gemini" type="button">
        <span>Open Gemini</span>
        <span id="open-gemini-shortcut">(…)</span>
      </button>
      <button id="open-gemini-shortcut-change" class="shortcut-change" type="button"
        aria-label="Change Open Gemini keyboard shortcut">Change</button>
    </section>
  </main>
  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>

</html>
